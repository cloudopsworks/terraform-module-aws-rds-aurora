# Module configuration
# All required and optional variables for terraform-module-aws-rds-aurora
# Do NOT include: is_hub, spoke_def, org, extra_tags (managed by Terragrunt hierarchy)

# settings:                                      # (Required) Root map for Aurora configuration
#   name_prefix: "mydb"                          # (Required) Used to build cluster/instance names when `name` not provided
#   name: "mydb-name"                            # (Optional) Explicit cluster identifier; overrides name_prefix when set
#   database_name: "mydb"                        # (Optional) Initial DB name; default: "cluster_db".
#                                                #            Set explicitly to null to skip the initial database, which also disables the module managed secret
#   master_username: "admin"                     # (Optional) Master user; default: "cluster_root". Forced to null when migration.enabled=true
#   engine_type: "aurora-postgresql"             # (Required) One of: "aurora-postgresql", "aurora-mysql"
#   engine_version: "15.3"                       # (Required) Aurora engine version supported by AWS
#   engine_mode: "provisioned"                   # (Optional) "provisioned" | "serverless"; default: "provisioned"
#   instance_size: "db.r6g.large"                # (Required) Instance class; use "db.serverless" for Serverless v1/v2
#   availability_zones:                          # (Required) List of AZs for cluster/instances
#     - "us-east-1a"
#     - "us-east-1b"
#   port: 5432                                   # (Optional) Cluster port; default: 5432. Use 3306 for aurora-mysql
#   apply_immediately: true                      # (Optional) Apply changes immediately; default: true
#   auto_minor_upgrade: false                    # (Optional) Auto minor version upgrade; default: false
#   publicly_accessible: false                   # (Optional) Make instances public; default: false
#   deletion_protection: true                    # (Optional) Protect cluster from deletion; default: true
#   allow_upgrade: true                          # (Optional) Allow major version upgrade; default: true
#   insights_mode: "standard"                    # (Optional) "standard" | "advanced"; default: "standard"
#   managed_password: false                      # (Optional) Delegate the master password to AWS Secrets Manager; default: false.
#                                                #            When false the module generates it and stores it on its own secret, handing it to the
#                                                #            cluster through write-only arguments so it never lands in state. No password is
#                                                #            generated when migration.enabled or recovery.enabled is true
#   managed_password_rotation: false             # (Optional) Enable rotation of the AWS managed secret; default: false. Only applies when managed_password is true
#   password_secret_kms_key_id: ""               # (Optional) KMS key ID or alias for the password secret, applied whether the secret is AWS managed
#                                                #            or module managed; default: "" (aws/secretsmanager)
#   password_secret_recovery_window: 30          # (Optional) Days Secrets Manager waits before deleting the module managed secret; default: unset (AWS
#                                                #            default of 30). One of 0 or 7 through 30, where 0 deletes it immediately with no recovery.
#                                                #            Consumed only at destroy time, so changing it alters nothing on the live secret.
#                                                #            Silently has no effect wherever the module managed secret is not created, which is whenever
#                                                #            managed_password, migration.enabled or recovery.enabled is true, or database_name is null
#   password_secret_import: false                # (Optional) Adopt an existing Secrets Manager secret of the same name instead of creating one; default: false.
#                                                #            One-time switch, set it back to false once the state holds the secret. The plan fails when no
#                                                #            such secret exists, so leave it false on a fresh deployment. Use it when a destroy left the
#                                                #            secret inside its recovery window, which keeps the name taken and blocks re-creation.
#                                                #            Only applies when managed_password is false
#   password_secret_replica:                     # (Optional) Cross region replicas of the module managed secret; default: none. Accepts a single object
#                                                #            or a list of them. Only applies when managed_password is false
#     - region: "us-west-2"                      # (Required when replica defined) Region the secret is replicated to
#       kms_key_id: ""                           # (Optional) KMS key of the replica region used to encrypt the replica; default: "" (aws/secretsmanager).
#                                                #            Must live in the replica region, password_secret_kms_key_id is never reused for a replica
#   rotation_lambda_name: ""                     # (Optional) External rotation Lambda name; only applies when managed_password is false
#   password_rotation_period: 90                 # (Optional) Rotation period in days; default: 90. Also the regeneration cadence of the module generated password
#   rotation_duration: "1h"                      # (Optional) Rotation Lambda duration; default: "1h"
#   recovery:                                    # (Optional) Restore cluster from snapshot or another cluster
#     enabled: false                             # (Optional) Enable recovery mode; default: false
#     cluster_identifier: ""                     # (Optional) Source cluster identifier
#     snapshot_identifier: ""                    # (Optional) Specific snapshot identifier
#   global_cluster:                              # (Optional) Manage Aurora Global Database
#     create: false                              # (Optional) Create a new Global Cluster; default: false
#     id: ""                                     # (Optional) Existing Global Cluster ARN/ID to join
#   encryption:                                  # (Optional) Cluster encryption; every key takes precedence over its storage.encryption counterpart
#     enabled: false                             # (Optional) Enable at-rest encryption; default: false
#     kms_key_id: ""                             # (Optional) Existing KMS key ID
#     kms_key_arn: ""                            # (Optional) Existing KMS key ARN
#     kms_key_alias: ""                          # (Optional) Existing KMS key alias, used only when no key ID or ARN is set; "alias/" is added when missing.
#                                                #            When none of the three is set anywhere, the module creates and manages its own key, whose policy
#                                                #            grants the account root, RDS via kms:ViaService, and CloudWatch Logs for /aws/rds/cluster/<id>/*
#     deletion_window: 30                        # (Optional) Module managed key deletion window; default: 30
#     rotation_enabled: true                     # (Optional) Enable automatic rotation of the module managed key; default: true
#     rotation_period: 90                        # (Optional) Module managed key rotation period; default: 90
#     multi_region: false                        # (Optional) Create the module managed key as multi-region; default: false
#   storage:                                     # (Optional) Storage configuration
#     type: ""                                   # (Optional) "" | "aurora-iopt1" | "io1" | "io2"
#     iops: 1000                                 # (Optional) Required when type is io1/io2
#     encryption:                                # (Optional) Storage encryption settings; superseded by the top level encryption block
#       enabled: false                           # (Optional) Enable at-rest encryption; default: false
#       kms_key_id: ""                           # (Optional) Existing KMS key ID
#       kms_key_arn: ""                          # (Optional) Existing KMS key ARN
#       kms_key_alias: ""                        # (Optional) Existing KMS key alias
#       deletion_window_in_days: 30              # (Optional) KMS key deletion window; default: 30
#       rotation_period_in_days: 90              # (Optional) KMS key rotation period; default: 90
#       rotation_enabled: true                   # (Optional) Enable automatic rotation of the module managed key; default: true
#       multi_region: false                      # (Optional) Create the module managed key as multi-region; default: false
#   monitoring:                                  # (Optional) Enhanced monitoring
#     interval: 0                                # (Optional) Interval seconds; 0,1,5,10,15,30,60; default: 0 (disabled)
#   performance:                                 # (Optional) Performance Insights. Alias: performance_insights, which takes precedence
#     enabled: false                             # (Optional) Enable Performance Insights; default: false
#     retention_period: 7                        # (Optional) Retention days; default: 7 (7, 731 or any multiple of 31)
#     encryption:                                # (Optional) PI encryption settings
#       enabled: false                           # (Optional) Enable PI encryption; default: false
#       kms_key_alias: ""                        # (Optional) Existing KMS alias, used only when no key ID or ARN is set; "alias/" is added when missing.
#                                                #            When none is set the module creates and manages its own Performance Insights key
#       kms_key_id: ""                           # (Optional) Existing KMS key ID
#       kms_key_arn: ""                          # (Optional) Existing KMS key ARN
#   performance_insights:                        # (Optional) Alias of the performance block; every key takes precedence over its performance counterpart
#     enabled: false                             # (Optional) Enable Performance Insights; default: false
#     retention_period: 7                        # (Optional) Retention days; default: 7
#     kms_key_id: ""                             # (Optional) Existing KMS key ID for Performance Insights
#     kms_key_alias: ""                          # (Optional) Existing KMS key alias for Performance Insights
#     kms_key_arn: ""                            # (Optional) Existing KMS key ARN for Performance Insights
#     encryption:                                # (Optional) Same shape as performance.encryption
#       enabled: false                           # (Optional) Enable PI encryption; default: false
#   maintenance:                                 # (Optional) Maintenance window
#     window: "sun:03:00-sun:04:00"             # (Optional) Default: sun:03:00-sun:04:00
#   backup:                                      # (Optional) Backup configuration
#     enabled: false                             # (Optional) Tag the cluster for an external AWS Backup plan; default: false
#     only_tag: true                             # (Optional) Only tag for AWS Backup, do not manage a plan; default: true.
#                                                #            Applies only when backup.enabled is true
#     schedule: "daily"                          # (Optional) Value of the aws-backup-schedule tag; default: "daily".
#                                                #            Applies only when backup.enabled and backup.only_tag are true
#     retention_period: 7                        # (Optional) Snapshot retention days; default: 5
#     window: "01:00-02:30"                      # (Optional) Backup window; default: "00:45-02:45"
#     copy_tags: true                            # (Optional) Copy tags to snapshots; default: true
#   replicas:                                    # (Optional) Replica instance configuration
#     count: 2                                   # (Optional) Number of instances; default: 1
#     replica_0:
#       availability_zone: "us-east-1a"          # (Optional) AZ override for this replica
#       promotion_tier: 10                        # (Optional) Failover priority 1-15
#       maintenance_window: "wed:03:00-wed:04:00" # (Optional) Per-instance maintenance window
#     replica_1:
#       availability_zone: "us-east-1b"
#       instance_size: "db.r5.xlarge"             # (Optional) Instance class override
#   serverless:                                   # (Optional) Serverless mode
#     enabled: false
#     v2: false
#     scaling_configuration:
#       min_capacity: 0.5
#       max_capacity: 16.0
#       seconds_until_auto_pause: 300
#       auto_pause: false                         # (Optional) v1 only
#       timeout_action: ForceApplyCapacityChange  # (Optional) v1 only
#   iam:                                          # (Optional) IAM settings
#     database_authentication_enabled: true
#     authentication_roles: []
#   cloudwatch:                                   # (Optional) CloudWatch logging
#     retention_days: 90                          # (Optional) Log retention days; default: 90
#     retain: true                                # (Optional) Prevent log group destroy on delete; default: true
#     kms_key_id: ""                              # (Optional) KMS key ID or ARN used to encrypt the log groups; default: "" (AWS managed)
#     kms_key_alias: ""                           # (Optional) KMS key alias used to encrypt the log groups, used only when kms_key_id is not set;
#                                                 #            "alias/" is added when missing. When neither is set, falls back to the module managed key
#                                                 #            only, never to an operator supplied encryption key, and to AWS default encryption when the
#                                                 #            module owns no key. An operator key is not guaranteed to grant CloudWatch Logs, and an AWS
#                                                 #            managed key such as aws/rds grants none and cannot be edited
#     log_exports:                                # (Optional) Enabled log exports; default: [postgresql] for PG, [audit, error] for MySQL
#       - postgresql
#   cluster_parameter_group:                      # (Optional) Cluster-wide parameter group, applied to the cluster
#     create: false                               # (Optional) Create a dedicated DB cluster parameter group; default: false
#     family: "aurora-postgresql15"               # (Optional) If not set, computed as engine_type + engine_version
#     parameters:                                 # (Optional) List of {name, value, apply_method}; default: []
#       - name: "PARAM NAME"
#         value: "PARAM VALUE"
#         apply_method: "immediate"               # (Optional) "immediate" | "pending-reboot"
#   parameter_group:                              # (Optional) Instance parameter group, applied to every cluster instance
#     create: false                               # (Optional) Create a dedicated DB parameter group; default: false
#     family: "aurora-postgresql15"               # (Optional) If not set, computed as engine_type + engine_version
#     skip_destroy: false                         # (Optional) Keep the parameter group on destroy; default: false
#     parameters: []                              # (Optional) List of {name, value, apply_method}; default: []
#   migration:                                    # (Optional) Migration from an existing RDS instance by replication
#     enabled: false                              # (Optional) Enable replication from the source instance; default: false. When true the
#                                                 #            cluster inherits its source credentials, so no master password is generated
#     source_rds_instance: ""                     # (Required when enabled) Source RDS instance identifier
#   hoop:                                         # (Optional) Hoop connection output settings
#     enabled: false
#     agent_id: ""
#     community: true
#     import: false
#     tags: {}
#     access_control: []
#   events:                                       # (Optional) RDS event subscriptions
#     enabled: false
#     sns_topic_arn: ""
#     sns_topic_name: ""
#     categories: []
#     instances: false
#   custom_endpoints:                             # (Optional) Additional cluster endpoints
#     - name: "custom-endpoint-1"
#       type: "READER"
#       static_members: []
#       excluded_members: []
settings: {}

# vpc:                                            # (Required) Networking settings for the cluster
#   vpc_id: "vpc-12345678901234"                  # (Required) Target VPC ID
#   subnet_group: "db-subnet-group-name"          # (Required) Existing DB subnet group name
#   subnet_ids:                                   # (Optional) Subnet IDs for auxiliary lookups
#     - "subnet-abcdef123456789"
#     - "subnet-abcdef123456781"
#     - "subnet-abcdef123456782"
vpc: {}

# security_groups:                                # (Required) Ingress configuration for database port
#   create: false                                 # (Optional) Create SG or use existing; default: false
#   name: "sg-rds"                                # (Required when create=false) Existing SG name
#   group_ids: []                                 # (Optional) Extra SG IDs to allow ingress from
#   allow_cidrs:                                  # (Optional) CIDR blocks allowed to connect
#     - "10.0.0.0/16"
#   allow_security_groups:                        # (Optional) SG names to allow ingress from
#     - "sg-name-123456"
security_groups: {}
